[package]
name = "daytona-ultimate-core"
version = "0.0.0"
description = "Checks the player's DUSA and CCE discs and builds Daytona USA Ultimate from them: the work both builders share"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
