[package]
name = "daytona-ultimate"
version = "0.1.0"
description = "Builds Daytona USA Ultimate from the player's own DUSA and CCE discs"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
strip = true

# hashing and ECC are slow unoptimized; debug builds still check discs at a usable speed
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
