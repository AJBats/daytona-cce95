<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daytona USA Ultimate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="stage"></canvas>
<button id="mute" title="Sound on (M)" aria-label="Mute sound">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
    <g class="waves"><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></g>
    <g class="cross"><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></g>
  </svg>
</button>
<header>
  <div class="title">DAYTONA USA <span>ULTIMATE</span></div>
  <div class="sub">Disc builder</div>
</header>
<footer>
  <button id="go" disabled>COMBINE</button>
  <div id="status"></div>
</footer>
<script src="app.js"></script>
</body>
</html>
